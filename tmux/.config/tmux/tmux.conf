# tmux configuration.
# Window-focused workflow (panes are rarely used).
# Rosé Pine Moon palette to match nvim and wezterm.
# Prefix: Ctrl-a (more ergonomic than default Ctrl-b).

##### Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Core behaviour
# Set explicitly because a WezTerm launched from Finder starts the tmux server
# with only the launchd PATH — no /opt/homebrew — so nothing brew-installed is
# found by run-shell or by anything a pane spawns non-interactively.
#
# No $HOME/.local/bin here, because nothing needs it: every script below is
# invoked by absolute path, and .zshrc prepends it for interactive shells. (It
# could be written. tmux's config parser expands $HOME inside double quotes,
# though not inside single ones, so "$HOME/.local/bin" would be stored as the
# real path.)
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g base-index 1                 # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on          # fill gaps when windows are closed
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -sg escape-time 10              # near-instant Esc (important for nvim)
set -g focus-events on              # let nvim detect focus changes

##### Terminal / colours
set -g default-terminal "tmux-256color"
# Reset first. -a appends, and prefix S sources this whole file again, so every
# reload added one more copy of the line below to the list. -u puts back tmux's
# default list, which is what a new server starts from anyway.
set -su terminal-features
# RGB = true colour. usstyle = styled underlines (undercurl, and coloured
# underlines). Without usstyle tmux strips those sequences, so nvim's diagnostic
# undercurls arrive as plain underlines with no colour — terminfo for
# tmux-256color carries neither Smulx nor Setulc, so tmux will not infer it.
#
# The last three are the same story for other sequences WezTerm understands and
# tmux drops unless told the terminal does: sync is synchronized output (DEC
# mode 2026), which has the terminal paint each redraw whole instead of tearing
# partway through it; hyperlinks passes OSC 8 links through, which otherwise
# arrive as plain text; overline is SGR 53. tmux infers none of them for
# WezTerm -- not from its TERM, xterm-256color by default, and not from its
# version reply, which tmux does not recognise -- so they are declared here.
#
# tmux works out a client's features when the client attaches, so prefix S
# updates the server's list but not the features of a WezTerm window that is
# already attached. A change to this line reaches that window once it detaches
# and attaches again; a new WezTerm window has it from the start.
set -sa terminal-features ",*:RGB:usstyle:extkeys:sync:hyperlinks:overline"

# extkeys + extended-keys are what make Ctrl-Shift-<key> a DIFFERENT key from
# Ctrl-<key>. A traditional terminal sends the same byte for both -- Ctrl-r and
# Ctrl-Shift-r are both 0x12 -- so a binding for one silently answers the other.
# With both, tmux asks the outer terminal for xterm's modifyOtherKeys mode 2: it
# sends ESC [>4;2m because extended-keys is on and the extkeys feature says the
# terminal can take it. extended-keys-format has no part in that request; it
# only picks how tmux encodes such keys for the programs inside its panes. Of
# what can come back, tmux reads CSI 27;6;114~ and CSI 114;6u as C-S-r, and
# 0x12 as C-r. (CSI 27;6;82~, the same with a capital R's code, fires neither.)
# wezterm.lua's enable_kitty_keyboard does not come into it: tmux never asks
# for the kitty protocol. extended-keys on also lets a program inside a pane
# ask tmux for the same modes for its own keys (tmux's manual, extended-keys).
#
# The pair was added for restore, when it was bound to C-S-r. Restore no
# longer needs it: it moved to M-r (see @resurrect-restore below), because
# WezTerm keeps Ctrl-Shift-R for itself and the key never reached tmux.
# checks/repo.sh still requires the pair for any Shift-bearing restore key.
set -s extended-keys on

##### Keybindings
# Navigation — vim-style: h/l for windows, j/k for sessions
bind h previous-window
bind l next-window
bind H swap-window -t -1\; select-window -t -1
bind L swap-window -t +1\; select-window -t +1
bind j switch-client -n
bind k switch-client -p
bind w choose-tree -Zw              # full session/window overview

# Windows
bind c new-window -c "#{pane_current_path}"
bind q confirm-before -p "Kill window #W? (y/n)" "if-shell '[ #{session_windows} -gt 1 ]' kill-window 'run-shell \"~/.local/bin/tmux-kill-session\"'"
bind r command-prompt -I "#W" "rename-window '%%'"

# Sessions — C creates, Q kills (spawns a new session first if it's the last
# one, so WezTerm doesn't close)
unbind C
bind C new-session
bind Q run-shell "~/.local/bin/tmux-kill-session"
bind R command-prompt -I "#S" "rename-session '%%'"
bind f display-popup -E "~/.local/bin/tmux-sessionizer"

# Utility
# Clears the screen and scrollback. Delegated to a script because it has to look
# at what the pane is running first: sending "clear" blindly types into whatever
# owns the pty, which mangles an open nvim buffer and then erases the evidence.
bind BSpace run-shell "~/.local/bin/tmux-clear-scrollback"

# Save / source
#
# The 'quiet' argument matters: without it save.sh runs a spinner that repaints
# the status line every 100ms and then prints its own "Tmux environment saved!",
# which buries anything the guard has to say. And the message is left to the
# guard rather than added here, because a hard-coded "Session saved" would be a
# lie whenever the guard vetoes the save. @resurrect-guard-announce tells the
# guard this save was triggered by hand, so it should report either way; it
# clears itself, so continuum's timed saves stay silent unless they are vetoed.
bind s set -g @resurrect-guard-announce on \; run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"
# Forced save — bypasses the degenerate-state guard for one save. Use when you
# really do want to record a stripped-down session. Both flags clear themselves.
bind M-s set -g @resurrect-guard-force on \; set -g @resurrect-guard-announce on \; run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"
bind S source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

##### Clipboard
# One clipboard, the system's: a copy out of copy mode lands on it, and
# prefix+] pastes from it.
#
# copy-command is what copy-pipe runs when a binding gives it no command, and
# tmux's own bindings for Enter, a mouse drag, and double and triple click are
# all argument-less copy-pipe-and-cancel. So this one line reaches all of those
# as well as y, including the ones this file never binds. (Not A: that appends
# to tmux's buffer and pipes nothing.) The command used to be written into the y
# binding instead, which reached y and nothing else: Enter or a mouse drag only
# got to the clipboard if WezTerm acted on the OSC 52 below.
#
# pbcopy by name, found through the set-environment PATH at the top of this
# file. No wl-copy/xclip/xsel fallback any more: bootstrap.sh refuses to run
# anywhere but macOS, so that chain only ever took its first branch.
# checks/repo.sh reads this value, and tests/test-bindings.sh presses y and ].
set -s copy-command 'pbcopy'

# OSC 52 stays on, for a different job: it is how a program INSIDE tmux -- nvim
# on a remote host over ssh, say -- reaches this Mac's clipboard, by way of
# WezTerm. "on" and not tmux's default "external", because external ignores
# exactly those application-sent sequences. Locally it means a tmux copy is set
# twice, by pbcopy and by WezTerm, to the same text.
set -g set-clipboard on

bind -T copy-mode-vi v send-keys -X begin-selection
# No command after copy-pipe-and-cancel: one there would override copy-command
# for this key alone.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# prefix+] pastes the SYSTEM clipboard. tmux's default ] pastes its own newest
# buffer, which only ever holds what was copied inside tmux, so text copied in a
# browser never came out of it.
#
# run-shell without -b finishes before the next command runs, so the buffer is
# loaded by the time paste-buffer looks for it. paste-buffer is here rather than
# inside the shell so it targets the pane the key was pressed in. -p brackets
# the paste when the program has asked for that, so zsh does not run a pasted
# line and nvim does not re-indent it. -b system and -d paste exactly the buffer
# just loaded and then delete it: an empty clipboard pastes nothing, rather than
# whatever tmux copied last. The `tmux` inside run-shell reaches THIS server,
# because tmux sets $TMUX for the jobs it runs.
bind ] run-shell "pbpaste | tmux load-buffer -b system -" \; paste-buffer -p -d -b system

##### Status bar (rose-pine-moon palette)
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left "#[fg=#c4a7e7,bold] #S "
set -g status-right "#[fg=#6e6a86] %H:%M "
set -g window-status-current-format "#[fg=#c4a7e7,bold] #I:#W "
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g status-left-length 20
set -g status-position bottom
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#232136,fg=#e0def4"

##### TPM (Tmux Plugin Manager)
# bootstrap.sh's install_tmux_plugins clones tpm and every @plugin below. The
# `if` clones tpm alone when it is missing, as after a `make stow` with no
# bootstrap; prefix+I then installs the rest.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore is prefix M-r, off resurrect's C-r default, deliberately.
#
# The prefix is C-a, so restoring means holding Ctrl and pressing a. If Ctrl is
# still down when the next key is pressed, `prefix r` -- the rename-window
# binding above -- becomes `prefix C-r`, resurrect's default restore. Renaming
# a window and restoring the whole session are not near neighbours in intent,
# and one of them is very hard to undo. A held Ctrl does not reach M-r.
#
# It was C-S-r first, which tmux could tell from C-r (the extended-keys pair
# above) but which never arrived from WezTerm: WezTerm's own key table maps
# Ctrl-Shift-R to ReloadConfiguration, and WezTerm acts on its table before
# anything is sent to the pane, so the key reloaded WezTerm's config instead.
# M-r is not in that table; checks/machine.sh reads it, with wezterm.lua
# loaded, and fails if the restore key appears there.
#
# M-r needs no extended keys. tmux reads it from ESC r, and from CSI 27;3;114~,
# the form a terminal in modifyOtherKeys mode sends; tests/test-bindings.sh
# presses prefix and each of the two on a test server, and checks that a saved
# session comes back. It sits beside M-s, the forced save.
#
# NOT done here, and worth knowing rather than discovering: @resurrect-save is
# still at its C-s default, so `prefix C-s` has exactly the same held-Ctrl
# hazard against `prefix s`. It is worse than the restore case in one way --
# `bind s` sets @resurrect-guard-announce first and the plugin's own C-s does
# not, so an accidental C-s saves without announcing what the guard decided.
# Left alone because moving it was not asked for, not because it is fine.
set -g @resurrect-restore 'M-r'

set -g @resurrect-capture-pane-contents 'on'    # restore visible pane content
set -g @continuum-restore 'on'                  # auto-restore on tmux start
set -g @continuum-save-interval '15'            # auto-save every 15 minutes

# WORTH KNOWING, because nothing about the settings above hints at it: continuum
# has no timer. It appends `#(continuum_save.sh)` to status-right and depends on
# tmux running that command each time it DRAWS the status line — which tmux only
# does for an attached client.
#
# So a server you have detached from and left running does not auto-save. Not
# late, not partially: not at all, for as long as nothing is attached. Verified
# on a private socket with status-interval 1 — nothing after 30 seconds
# detached, a save within 2 seconds of attaching. Asserted in
# tests/test-continuum.sh.
#
# Two consequences. status-right must stay ABOVE the `run` line at the bottom of
# this file, or it overwrites continuum's addition and auto-save stops for good
# (check.sh asserts the ordering). And the last save always reflects the last
# time you were attached, so `tmux-resurrect-saves list` showing nothing recent
# after a long detached stretch is the mechanism working as designed, not a
# fault to hunt.

# Don't let a throwaway session state overwrite a good save.
#
# Continuum saves on a timer, so if that timer fires while tmux is holding
# something trivial — the bare one-window "main" session WezTerm creates on
# startup, say — the trivial state gets written and `last` is repointed at it.
# Auto-restore then brings back the trivial state instead of the real one.
#
# The guard runs as resurrect's post-save-layout hook, which fires after the
# candidate save is written but before `last` is moved. It counts windows in
# the candidate and vetoes the save if the state looks throwaway. See the
# script's header comment for how the veto works and how to tune it.
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-guard'
# Second hook: resurrect rewrites the shared pane_contents.tar.gz after the
# layout decision, so a veto also has to put back the scrollback belonging to
# the save it protected. Only does anything when the save above was vetoed.
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-resurrect-guard --post-save-all'
set -g @resurrect-guard 'on'                    # master switch
set -g @resurrect-guard-min-windows '2'         # fewer windows than this is never saved
set -g @resurrect-guard-collapse-pct '50'       # hold a >50% drop once, accept it if it repeats
set -g @resurrect-guard-notify 'on'             # report vetoes on the status line

# Resurrect prunes saves older than this on every save (always keeping the
# newest 5). Kept in step with tmux-resurrect-saves' KEEP_DAILY_DAYS so the two
# retention mechanisms agree; run `tmux-resurrect-saves prune` to thin the rest.
set -g @resurrect-delete-backup-after '90'

# Initialise TPM (keep at very bottom)
#
# -b, so nothing waits for the plugins. Loading them is the slowest thing this
# file does: tpm runs each plugin's .tmux script, and every one of those runs
# the tmux binary again for each option it reads and each key it binds. In the
# foreground the first session is not created until all of that has finished,
# so a freshly launched WezTerm shows an empty window for that long, and prefix
# S blocks for as long again. tests/test-performance.sh times the start.
#
# What -b costs: for a moment after the server starts, the keys the plugins
# bind (C-h/j/k/l, resurrect's save and restore, tpm's I) are not bound yet. A
# reload keeps them, because nothing in this file unbinds them. What a reload
# loses for a moment is continuum's #(): the status-right line above puts back
# the value without it, and continuum adds it again only once tpm loads it.
# Being the last line is what makes it safe to background: nothing below it can
# race the load, and continuum still adds its #() to status-right, a moment
# later than before.
run -b '~/.config/tmux/plugins/tpm/tpm'
