# No blank line between prompts. The `format` below controls what the prompt
# contains, not the blank line before it — that is add_newline, which defaults
# to true, so this comment described the opposite of what was happening.
add_newline = false
format = "$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration$line_break$character"

# Directory: short, readable
[directory]
style = "cyan"
truncate_to_repo = false
truncation_length = 5

# Substitutions are plain substring replacements over the whole path, not
# matches on whole directory names. A "code" key drew ~/.vscode as
# ~/.vs<icon> and ~/.codex as ~/.<icon> x, and no directory in ~ is named
# code, so it went. The keys left can misfire the same way (a .configurator
# reads <icon>urator); add one only if it is unlikely to turn up inside
# another name.
[directory.substitutions]
"~" = " "
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
".config" = " "

# Git branch: clear, single icon
[git_branch]
symbol = " "
style = "purple"
format = " [$symbol$branch]($style)"

# Git status: minimal but informative
[git_status]
style = "yellow"
format = " [$all_status$ahead_behind]($style)"
# Every symbol ends in a space. The format above has no trailing separator and
# the modules after this one begin with a word ("via", "took"), so the last
# symbol drawn is the only gap between them: ahead was a bare "⇡" and a branch
# ahead of its upstream read "⇡took 5s". checks/repo.sh asserts it for every
# symbol in this table.
conflicted = " "
modified = " "
staged = " "
untracked = " "
deleted = "✖ "
ahead = "⇡ "
behind = "⇣ "
diverged = "⇕ "
stashed = " "

