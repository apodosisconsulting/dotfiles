name: checks

# The git hooks run check.sh on commit and the suites on push, but both are
# local: `--no-verify` skips them, and a fresh clone that never ran `make hooks`
# never had them. This makes the checks a property of the repository rather than
# of one laptop.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # macOS because the full setup is the Mac's: WezTerm, the fonts, Homebrew's
    # paths, Neovim and its language servers. These checks and suites are about
    # that, and a Linux runner would need every one of those assertions
    # weakened to pass. What bootstrap.sh builds on a Linux server is a
    # different, smaller thing, and the server job below checks it there.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Only what the suites and the repo-level checks need. Deliberately NOT
      # the full bootstrap: installing WezTerm, fonts and language servers to
      # assert things about this laptop would be slow and would still prove
      # nothing about a CI runner.
      #
      # tree-sitter-cli because Homebrew's neovim is 0.12, which is what
      # nvim-treesitter's main branch needs, and main builds every parser with
      # it. Without it the build run by "Prime the Neovim plugins" fails, no
      # parser is installed, and the nvim suite skips its indent check for want
      # of the queries that come with them.
      - name: Install dependencies
        run: brew install stow shellcheck shfmt neovim tree-sitter-cli tmux stylua prettier

      # `make lint` derives its file set from the shebangs rather than listing
      # paths. The list that used to be here omitted tmux/.local/bin, so none of
      # the five scripts that get stowed onto PATH were linted at all.
      - name: Lint
        run: make lint

      # Repository-internal assertions only. checks/machine.sh needs WezTerm, a
      # font, a stow tree and a git identity, none of which a runner has; see
      # check.sh's header for why the two halves are kept apart.
      - name: Repository checks
        run: make check-repo

      # Without this the runner skips the suites that matter most: restore,
      # integration, nvim, and every binding whose script has to be stowed or
      # whose plugin has to be installed. They skip honestly — each names the
      # file it wanted — but a check that only ever runs on one laptop is the
      # thing CI exists to replace. Stowing and fetching the tmux plugins is
      # cheap and makes them real.
      #
      # No count of those bindings here on purpose: it was "five", and a sixth
      # skip-guarded binding would have made it quietly wrong the way every
      # other number written into a comment in this repo went wrong.
      #
      # The plugins come from bootstrap.sh's install_tmux_plugins, which clones
      # every @plugin line in tmux.conf, so CI gets what a fresh machine gets.
      # The three clones written out here left vim-tmux-navigator out. A clone
      # that fails only warns in bootstrap, where prefix I can finish the job;
      # here the warning fails the step, or the suites needing that plugin
      # would skip and the run would stay green.
      - name: Install the dotfiles so the suites can exercise them
        run: |
          make stow
          plugins_log="$(bash -c '. ./bootstrap.sh && install_tmux_plugins' 2>&1)"
          printf '%s\n' "$plugins_log"
          case "$plugins_log" in *WARN:*) exit 1 ;; esac

      # The first nvim run installs the whole plugin set through lazy — no count
      # here, because a number in a comment is a number nothing re-counts. Done as
      # its own step so
      # a network failure here is distinguishable from a test failure.
      #
      # restore, not sync. sync runs update, which moves every plugin to the tip
      # of its branch and rewrites the lock, so CI was testing versions this repo
      # never pinned while a fresh machine got the pinned ones. Startup installs a
      # missing plugin at its locked commit, and restore puts any plugin already
      # present back on it. checks/repo.sh fails on a sync or update here.
      #
      # The treesitter parsers are built here too, by nvim-treesitter's build
      # in treesitter.lua: lazy runs it as part of installing the plugin, and
      # it waits for every parser, because +qa would otherwise end the builds.
      - name: Prime the Neovim plugins
        run: nvim --headless "+Lazy! restore" +qa || echo "lazy restore failed; the nvim suite will report what it could not do"

      - name: Test suites
        run: make test

  server:
    # What bootstrap.sh builds on a Debian or Ubuntu server. The job above
    # cannot say: on a Mac that half of the script never runs. Each cell is a
    # stock image of one release, as root with no sudo installed, which is how
    # Debian hands a server over, or as a new user who has sudo.
    # tests/linux-server.sh runs bootstrap.sh there and checks the shell, tmux
    # and git it leaves behind.
    #
    # ubuntu:22.04 is the release bootstrap.sh refuses, its git being too old
    # for the git config here. The test checks the refusal instead: that it is
    # made for that reason, and that nothing is left half linked.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "ubuntu:26.04"]
        account: [root, user]
        include:
          - image: "ubuntu:22.04"
            account: root
    container: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up a fresh server and check what it built
        run: bash tests/linux-server.sh --as-${{ matrix.account }}
